<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boss Modal</title>
<style>
  :root {
    --gold: #c9a45c; --gold-d: #b8923e; --line: #2a262e;
    --txt: #d8d2dc; --mut: #8d8794; --red: #d4455a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: #050407;
    display: flex; align-items: center; justify-content: center;
    font-family: "Segoe UI", Tahoma, Arial, sans-serif; color: var(--txt);
  }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }

  /* ===== MODAL ===== */
  .modal {
    position: relative; width: 1087px; height: 545px; flex-shrink: 0; overflow: hidden;
    transform: scale(var(--s, 1)); transform-origin: center center;
    background: radial-gradient(ellipse at 45% 45%, #5a3a78 0%, #36214d 30%, #1a0f27 60%, #0a0610 100%);
    box-shadow: 0 0 0 1px #000, 0 20px 80px rgba(0,0,0,.9);
    font-size: 13px; user-select: none;
  }
  .fog {
    position: absolute; inset: 0; pointer-events: none; z-index: 1;
    background:
      radial-gradient(ellipse 40% 25% at 40% 85%, rgba(150,110,190,.35), transparent 70%),
      radial-gradient(ellipse 30% 20% at 70% 70%, rgba(120,80,160,.25), transparent 70%);
    animation: drift 12s ease-in-out infinite alternate;
  }
  @keyframes drift { to { transform: translateX(3%) scale(1.06); opacity: .75; } }
  .vignette {
    position: absolute; inset: 0; pointer-events: none; z-index: 1;
    background:
      linear-gradient(to bottom, transparent 55%, rgba(0,0,0,.65) 100%),
      linear-gradient(90deg, rgba(0,0,0,.85) 0%, transparent 18%, transparent 75%, rgba(0,0,0,.7) 100%);
  }

  /* ===== ABAS ===== */
  .tabs { position: absolute; top: 0; left: 0; display: flex; z-index: 5; }
  .tab {
    width: 130px; padding: .85em 0; text-align: center;
    font-weight: 700; letter-spacing: .03em; background: #0d0b0e; color: #6e6a72;
    border-bottom: 2px solid transparent; transition: color .15s;
  }
  .tab:hover { color: #b9b3c0; }
  .tab.active { color: #d8b868; background: linear-gradient(#1c1710, #0d0b0e); border-bottom-color: var(--gold-d); }

  /* ===== FAIXAS ===== */
  .strips {
    position: absolute; top: 46px; left: 0; width: 260px; height: 220px; display: flex; gap: 2px; z-index: 3;
    overflow-x: auto; overflow-y: hidden; overscroll-behavior: contain;
    scrollbar-width: thin; scrollbar-color: #5a4624 #15131a;
  }
  .strips::-webkit-scrollbar { height: 5px; }
  .strips::-webkit-scrollbar-track { background: #15131a; }
  .strips::-webkit-scrollbar-thumb { background: #5a4624; border-radius: 3px; }
  .strip { flex: 1; position: relative; overflow: hidden; border-top: 1px solid #ffffff22; cursor: pointer; transition: filter .15s; }
  .strips .strip:nth-child(n) { flex: 0 0 120px; }
  .strips .strip:nth-child(n+5) { background: linear-gradient(160deg, #5a4a6a, #2a2036 60%, #120c1a); }
  .strip:hover { filter: brightness(1.25); }
  .strip.on { outline: 2px solid var(--gold-d); outline-offset: -2px; }
  .strip:nth-child(1) { flex: 1.1; background: linear-gradient(160deg, #c9a05a, #6c4b30 55%, #2a1a14); border-left: 2px solid var(--gold-d); }
  .strip:nth-child(2) { flex: 1.3; background: linear-gradient(160deg, #4a5656, #2b3636 60%, #151c1c); }
  .strip:nth-child(3) { flex: 1.5; background: linear-gradient(160deg, #8a9a9a, #4d5e5e 55%, #1a2424); }
  .strip:nth-child(4) { flex: .5;  background: linear-gradient(160deg, #3a4040, #1a1f1f); }
  .strip::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 60%, rgba(0,0,0,.9)); }

  /* ===== BOSS (GIF) ===== */
  .boss {
    position: absolute; left: 50%; top: 50%; z-index: 2; width: 420px; height: 420px;
    transform: translate(-50%, -50%); pointer-events: none;
  }
  .boss img {
    width: 100%; height: 100%; display: block; image-rendering: pixelated;
    filter: drop-shadow(0 0 28px rgba(160,110,220,.55));
  }
  .boss::after {
    content: ""; position: absolute; left: 50%; bottom: 6%; width: 55%; height: 8%; transform: translateX(-50%);
    background: radial-gradient(ellipse, rgba(0,0,0,.6), transparent 70%); z-index: -1;
  }

  /* ===== PAINEL DIREITO ===== */
  .panel {
    position: absolute; top: 2%; right: .7%; width: 19.6%; height: 96%; z-index: 6;
    background: linear-gradient(#141217ee, #0c0b0eee); border: 1px solid var(--line);
    display: flex; flex-direction: column; padding: 1.2em .9em .8em;
  }
  .subtitle { text-align: center; color: var(--mut); font-size: .95em; }
  .panel h1 { text-align: center; font-size: 2.1em; font-weight: 600; color: #e8e4ea; margin: .1em 0 .5em; }
  .stats { display: flex; justify-content: center; gap: 1.4em; margin: .9em 0 .8em; font-size: .95em; }
  .rule { height: 1px; background: var(--line); margin: .3em 0; }
  .label { text-align: center; color: var(--mut); font-size: .85em; margin: .4em 0 .45em; }

  .diff { display: flex; justify-content: center; gap: .5em; margin-bottom: .8em; }
  .diff button {
    width: 2.6em; height: 2.6em; background: #1b1a1e; border: 1px solid #2d2a31; color: #6c6770;
    font-size: .8em; font-weight: 700; transition: all .15s;
  }
  .diff button:hover { border-color: #5a4624; color: #b9b3c0; }
  .diff button.on { border-color: var(--gold-d); background: #2a2318; color: var(--gold); box-shadow: 0 0 8px #b8923e55; }

  /* grade de recompensas COM ROLAGEM */
  .rewards {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: .4em;
    flex: 1; min-height: 0; align-content: start;
    overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; padding-right: .3em; margin-bottom: .8em;
    scrollbar-width: thin; scrollbar-color: #5a4624 #15131a;
  }
  .rewards::-webkit-scrollbar, .list::-webkit-scrollbar { width: 5px; }
  .rewards::-webkit-scrollbar-track, .list::-webkit-scrollbar-track { background: #15131a; }
  .rewards::-webkit-scrollbar-thumb, .list::-webkit-scrollbar-thumb { background: #5a4624; border-radius: 3px; }
  .item { aspect-ratio: 1; position: relative; border: 1px solid #00000099; display: flex; align-items: center; justify-content: center; transition: transform .12s, border-color .12s; }
  .item:hover { transform: scale(1.08); border-color: var(--gold); z-index: 2; }
  .item::before { content: ""; width: 58%; height: 58%; background: var(--ic, #888); border-radius: var(--r, 30%); box-shadow: inset 0 0 6px #0008; }
  .item.blue  { background: linear-gradient(#1d3f7a, #12284d); }
  .item.red   { background: linear-gradient(#6b1c1c, #3d0f0f); }
  .item.green { background: linear-gradient(#245a2c, #123319); }
  .item.gray  { background: linear-gradient(#3a3a3a, #1e1e1e); }
  .item.dark  { background: linear-gradient(#333, #1b1b1b); }
  .item .lv { position: absolute; top: 0; left: 0; font-size: .55em; padding: .1em .5em; background: #1a6ac0; color: #fff; clip-path: polygon(0 0, 100% 0, 80% 100%, 0 100%); }
  .item .qty { position: absolute; bottom: 1px; right: 4px; font-size: .65em; color: #fff; }

  .btns { display: flex; gap: .5em; }
  .btn { flex: 1; padding: .75em 0; text-align: center; font-size: .78em; font-weight: 600; border: 1px solid #5a4624; color: #e3d8c0; background: linear-gradient(#2a2318, #17120a); transition: filter .15s, transform .1s; position: relative; }
  .btn:hover { filter: brightness(1.3); }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: linear-gradient(#8a6a2c, #5e4518); border-color: var(--gold-d); color: #fff; }
  .btn[hidden] { display: none; }
  .btn:disabled { filter: grayscale(1) brightness(.6); cursor: not-allowed; }
  .badge {
    position: absolute; top: -.7em; right: -.5em; min-width: 1.6em; height: 1.6em; padding: 0 .35em;
    border-radius: 1em; background: var(--red); color: #fff; font-size: .9em; display: none; align-items: center; justify-content: center;
  }
  .badge.show { display: flex; }

  /* ===== CAMADAS (Search Party / Criar) ===== */
  .layer { position: absolute; inset: 0; z-index: 20; background: rgba(0,0,0,.7); display: none; align-items: center; justify-content: center; }
  .layer.open { display: flex; animation: fade .15s ease-out; }
  @keyframes fade { from { opacity: 0; } }
  .box { background: linear-gradient(#17141b, #0d0b10); border: 1px solid #3a3320; box-shadow: 0 10px 40px #000; display: flex; flex-direction: column; }
  .box header { display: flex; align-items: center; justify-content: space-between; padding: .9em 1.1em; border-bottom: 1px solid var(--line); font-weight: 700; font-size: 1.15em; color: #e8d9b0; }
  .x { width: 1.8em; height: 1.8em; color: var(--mut); font-size: 1.1em; }
  .x:hover { color: #fff; }

  .party { width: 520px; height: 330px; }
  .party header { padding: .6em 1em; font-size: 1.05em; }
  .filters { display: flex; gap: .4em; padding: .5em 1em; border-bottom: 1px solid var(--line); align-items: center; }
  .chip { padding: .25em .8em; border: 1px solid #2d2a31; background: #1b1a1e; color: var(--mut); font-size: .9em; }
  .chip.on { border-color: var(--gold-d); color: var(--gold); background: #2a2318; }
  .filters .count { margin-left: auto; color: var(--mut); font-size: .9em; }
  .list { flex: 1; min-height: 0; overflow-y: auto; padding: .5em 1em; scrollbar-width: thin; scrollbar-color: #5a4624 #15131a; }
  .row { display: flex; align-items: center; gap: .8em; padding: .5em .7em; margin-bottom: .35em; background: #14121a; border: 1px solid #25222b; transition: border-color .15s; }
  .row:hover { border-color: #5a4624; }
  .row.mine { border-color: var(--gold-d); background: linear-gradient(90deg, #2a231866, #14121a); }
  .tag { padding: .2em .7em; font-size: .8em; font-weight: 700; border: 1px solid; min-width: 4.8em; text-align: center; }
  .tag.d0 { color: #7fc88a; border-color: #3d6b45; }
  .tag.d1 { color: #e0b45a; border-color: #7a5d24; }
  .tag.d2 { color: #e0657a; border-color: #8a2a3a; }
  .row .pinfo { flex: 1; min-width: 0; }
  .row .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .sub { color: var(--mut); font-size: .85em; margin-top: .15em; }
  .row .mem { color: #cfc9d2; font-size: .95em; min-width: 3.5em; text-align: center; }
  .row .act { padding: .35em .9em; font-size: .85em; font-weight: 600; border: 1px solid #5a4624; background: linear-gradient(#2a2318, #17120a); color: #e3d8c0; }
  .row .act:hover { filter: brightness(1.3); }
  .row .act.danger { border-color: #8a2a3a; background: #3a1018; }
  .row .act:disabled { filter: grayscale(1) brightness(.6); cursor: not-allowed; }
  .empty { text-align: center; color: var(--mut); padding: 3em 1em; }
  .empty b { display: block; font-size: 1.4em; margin-bottom: .4em; color: #6e6a72; }

  .create { width: 36%; }
  .form { padding: 1.1em; display: grid; gap: .9em; }
  .form label { display: grid; gap: .35em; color: var(--mut); font-size: .9em; }
  .form input, .form select {
    background: #0b0a0e; border: 1px solid #2d2a31; color: var(--txt); padding: .6em .7em; font: inherit; outline: none;
  }
  .form input:focus, .form select:focus { border-color: var(--gold-d); }
  .box footer { display: flex; gap: .6em; padding: 0 1.1em 1.1em; }
  .box footer .btn { font-size: .9em; }


  /* ===== EXPEDITION INFO ===== */
  .info { width: 690px; height: 450px; background: linear-gradient(#1c2528, #131a1c); border: 1px solid #3c4a4a; }
  .info header { justify-content: center; position: relative; border-bottom: 0; font-size: 1.5em; color: #c9b88a; padding: .6em 1em .4em; letter-spacing: .02em; }
  .info header .x { position: absolute; right: .5em; top: .45em; font-size: .8em; }
  .ibody { flex: 1; min-height: 0; display: grid; grid-template-columns: 205px 1fr; gap: 1em; padding: 0 1em 1em; }
  .iside { display: flex; flex-direction: column; min-height: 0; text-align: center; padding: .2em .3em; font-size: .92em; overflow: hidden; }
  .iside .rn { color: var(--mut); font-size: .95em; }
  .iside h2 { font-size: 1.9em; font-weight: 600; color: #e8e4ea; margin: .05em 0 .35em; }
  .istats { display: flex; justify-content: center; gap: 1em; margin: .6em 0 .4em; font-size: .9em; }
  .ientry { font-weight: 700; margin: .5em 0 .3em; font-size: .92em; }
  .idiff { display: flex; justify-content: center; margin-bottom: .5em; }
  .idiff span { width: 2.2em; height: 2.2em; border: 1px solid var(--gold-d); background: #2a2318; color: var(--gold); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: .9em; }
  .irew { display: grid; grid-template-columns: repeat(4, 1fr); gap: .3em; }
  .ifoot { margin-top: auto; text-align: left; padding-top: .6em; }
  .imem { color: var(--gold); font-weight: 700; margin-bottom: .35em; }
  .ichk { display: flex; align-items: center; gap: .5em; font-size: .9em; color: #cfc9d2; cursor: pointer; }
  .ichk input { accent-color: var(--gold-d); width: 1.1em; height: 1.1em; }
  .ichk input:disabled { opacity: .5; cursor: not-allowed; }

  .iright { display: flex; flex-direction: column; min-height: 0; }
  .istatus { background: #0f1517; border: 1px solid #2f3b3d; padding: .65em .8em; color: #9aa4a6; font-size: .9em; display: flex; justify-content: space-between; gap: 1em; }
  .istatus .iname { color: #6e777a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .slots { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: .45em; margin: .6em 0; }
  .slot { position: relative; flex: 1; max-height: 3.6em; display: flex; align-items: center; gap: .8em; padding: 0 .9em; border: 1px solid #2c3a3c; background: #172023; }
  .slot.filled { background: linear-gradient(90deg, #26363f, #1e2b31); border-color: #3a4d55; }
  .slot.filled.me { border-color: var(--gold-d); }
  .slot.locked { opacity: .45; }
  .sn { position: absolute; top: 0; left: 0; min-width: 1.4em; padding: 0 .35em; background: var(--gold-d); color: #1a1408; font-size: .72em; font-weight: 700; text-align: center; }
  .ico { width: 2.3em; height: 2.3em; border-radius: 50%; border: 2px solid var(--gold-d); background: #2a2318; color: var(--gold); display: flex; align-items: center; justify-content: center; font-size: .95em; flex-shrink: 0; }
  .who { flex: 1; min-width: 0; }
  .who .l1 { display: flex; gap: .5em; align-items: center; font-size: .95em; white-space: nowrap; }
  .who .crown { color: var(--gold); }
  .who .lv { color: #d9d6dc; font-weight: 600; }
  .who .pn { color: #e8e4ea; overflow: hidden; text-overflow: ellipsis; }
  .who .l2 { color: #9fb0b6; font-size: .85em; margin-top: .15em; }
  .slot .cls { font-size: .85em; color: #d9d6dc; letter-spacing: .04em; }
  .kick { width: 1.8em; height: 1.8em; color: #7a8386; border: 1px solid #3a4446; margin-left: .3em; font-size: .8em; }
  .kick:hover { color: #fff; border-color: #8a2a3a; background: #3a1018; }
  .slot .all { font-family: Georgia, "Times New Roman", serif; font-size: 1.6em; color: #7b868a; width: 1.6em; }
  .slot .allow { flex: 1; color: #c9d0d2; font-size: .9em; }
  .slot.locked .allow { color: #7b868a; }
  .plus { width: 1.9em; height: 1.9em; border-radius: 50%; border: 1px solid #8a9296; color: #c9d0d2; font-size: 1.1em; line-height: 1; display: flex; align-items: center; justify-content: center; transition: all .15s; }
  .plus:hover { border-color: var(--gold); color: var(--gold); background: #c9a45c22; }
  .ibtns { display: flex; justify-content: space-between; }
  .ibtns .btn { flex: none; width: 110px; font-size: 1em; padding: .65em 0; }
  .btn.danger { background: linear-gradient(#7a2a2e, #4a1519); border-color: #8a3a3e; color: #f1d8d8; }
  .row .acts { display: flex; gap: .4em; }
  .row .act.ghost { background: #1b1a1e; border-color: #3a3a40; }

  .toast {
    position: absolute; left: 50%; bottom: 8%; transform: translate(-50%, 20px); z-index: 30;
    background: #17141bf2; border: 1px solid var(--gold-d); color: #f0e4c4; padding: .7em 1.4em; font-size: .95em;
    opacity: 0; pointer-events: none; transition: all .25s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>

  <div class="vignette"></div>

  <div class="tabs">
    <button class="tab active">Boss</button>
    <button class="tab">Raid</button>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const $$ = s => [...document.querySelectorAll(s)];
  const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x !== undefined) e.textContent = x; return e; };
  const NAMES = ['I', 'II', 'Nightmare'];
  const SYMB = ['I', 'II', '☠'];
  const DIFFS = [
    { lv: 25, count: 14 },
    { lv: 35, count: 22 },
    { lv: 45, count: 32 }
  ];
  const POOL = [['Valkyr', 'HERO'], ['Mira', 'MAGE'], ['Torvald', 'TANK'], ['Sigrid', 'ROGUE'], ['Bjorn', 'HERO'],
                ['Astrid', 'MAGE'], ['Leif', 'TANK'], ['Freya', 'ROGUE'], ['Ragna', 'HERO'], ['Eirik', 'TANK']];
  const ME = { name: 'You', cls: 'HERO', lv: 62, power: 199593, me: true };

  const person = (i, salt) => {
    const [name, cls] = POOL[i % POOL.length];
    return { name, cls, lv: 40 + ((i * 7 + salt) % 30), power: 90000 + ((i * 31337 + salt * 977) % 120000) };
  };
  const seed = (id, name, diff, max, count, host) => {
    const players = [];
    for (let i = 0; i < count; i++) players.push(person(host + i, id));
    return { id, name, diff, max, players, mine: false, joined: false, fullStart: true };
  };

  const state = { diff: 2, filter: -1, parties: [], nextId: 1, infoId: null };

  /* ---------- persistência (opcional) ---------- */
  const KEY = 'boss-modal-v2';
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ p: state.parties, n: state.nextId })); } catch (e) {} };
  try {
    const s = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (s) { state.parties = s.p || []; state.nextId = s.n || 1; }
  } catch (e) {}
  if (!state.parties.length) {
    state.parties = [
      seed(state.nextId++, 'Nightmare farm - need DPS', 2, 5, 3, 0),
      seed(state.nextId++, 'Learning party, chill',     0, 4, 1, 1),
      seed(state.nextId++, 'Quick II run',              1, 5, 5, 2)
    ];
  }

  /* ---------- toast ---------- */
  let tt;
  const toast = msg => {
    const t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2200);
  };

  /* ---------- recompensas ---------- */
  const TYPES = [
    ['blue', '#7d8da8', '30%'], ['blue', '#8a8070', '30%'], ['blue', '#d9c88a', '30%'], ['blue', '#7ad4f0', '20%'],
    ['red', '#d9c3a0', '30%'], ['red', '#c9a090', '30%'], ['green', '#d9d3b0', '30%'], ['green', '#8a9a8a', '50%'],
    ['gray', '#b0a890', '30%'], ['gray', '#9a9080', '50% 50% 30% 30%'], ['dark', '#e8b830', '50%'], ['dark', '#c06a3a', '50%']
  ];
  const rng = seed => () => (seed = (seed * 16807) % 2147483647) / 2147483647;

  function fillRewards(box, diff, count, badges) {
    const r = rng(diff * 977 + 13);
    box.innerHTML = '';
    for (let i = 0; i < count; i++) {
      const [k, ic, rad] = TYPES[Math.floor(r() * TYPES.length)];
      const e = el('div', 'item ' + k);
      e.style.setProperty('--ic', ic);
      e.style.setProperty('--r', rad);
      e.title = 'Reward #' + (i + 1);
      if (badges) {
        if (i < 4 + diff && r() > .35) e.insertAdjacentHTML('beforeend', '<span class="lv">Lv.</span>');
        if (r() > .6) e.insertAdjacentHTML('beforeend', '<span class="qty">' + (1 + Math.floor(r() * 3)) + '</span>');
      }
      box.appendChild(e);
    }
  }
  function renderRewards() {
    fillRewards($('#rewards'), state.diff, DIFFS[state.diff].count, true);
    $('#rewards').scrollTop = 0;
  }

  /* ---------- dificuldade ---------- */
  function setDiff(d) {
    state.diff = d;
    $$('#diff button').forEach(b => b.classList.toggle('on', +b.dataset.d === d));
    $('#lv').textContent = 'Lv. ' + DIFFS[d].lv;
    renderRewards();
  }
  $('#diff').addEventListener('click', e => {
    const b = e.target.closest('button'); if (b) setDiff(+b.dataset.d);
  });

  /* ---------- helpers de expedição ---------- */
  const find = id => state.parties.find(x => x.id === id);
  const mine = () => state.parties.find(p => p.mine);
  const hasMe = p => p.mine || p.joined;
  const dropMe = p => { p.players = p.players.filter(pl => !pl.me); p.joined = false; };

  function updateBadge() {
    const n = state.parties.filter(p => p.players.length < p.max || hasMe(p)).length;
    const b = $('#badge'); b.textContent = n; b.classList.toggle('show', n > 0);

    // dentro de uma party: só o botão "View Party", ocupando o espaço dos dois
    const inParty = state.parties.some(hasMe);
    $('#btnSearch').hidden = inParty;
    $('#btnCreate').hidden = inParty;
    $('#btnView').hidden = !inParty;
  }
  $('#btnView').onclick = () => { const m = state.parties.find(hasMe); if (m) openInfo(m.id); };

  /* ---------- search party ---------- */
  function renderParties() {
    const list = $('#list'); list.innerHTML = '';
    const items = state.parties.filter(p => state.filter < 0 || p.diff === state.filter)
      .sort((a, b) => (b.mine - a.mine) || (b.joined - a.joined) || (b.id - a.id));
    $('#count').textContent = items.length + ' expedition' + (items.length === 1 ? '' : 's');

    if (!items.length) {
      list.innerHTML = '<div class="empty"><b>No expeditions found</b>Create one to see it here.</div>';
      return;
    }
    items.forEach(p => {
      const n = p.players.length;
      const full = n >= p.max && !hasMe(p);
      const row = el('div', 'row' + (hasMe(p) ? ' mine' : ''));

      const tag = el('span', 'tag d' + p.diff, NAMES[p.diff]);
      const info = el('div', 'pinfo');
      info.append(
        el('div', 'nm', p.name),
        el('div', 'sub', (p.mine ? 'Your expedition' : 'Host: ' + p.players[0].name) + ' · Lv. ' + DIFFS[p.diff].lv + (p.joined ? ' · Joined' : ''))
      );
      const mem = el('div', 'mem', '👥 ' + n + '/' + p.max);

      const acts = el('div', 'acts');
      if (hasMe(p)) {
        const i = el('button', 'act ghost', 'Info'); i.onclick = () => openInfo(p.id);
        const a = el('button', 'act danger', p.mine ? 'Disband' : 'Leave');
        a.onclick = () => (p.mine ? disband(p.id) : leave(p.id));
        acts.append(i, a);
      } else {
        const a = el('button', 'act', full ? 'Full' : 'Join'); a.disabled = full; a.onclick = () => join(p.id);
        acts.append(a);
      }
      row.append(tag, info, mem, acts);
      list.appendChild(row);
    });
  }

  function join(id) {
    const p = find(id);
    if (!p || p.players.length >= p.max) return;
    if (mine()) return toast('Disband your expedition first');
    state.parties.forEach(x => { if (x.joined) dropMe(x); });
    p.players.push({ ...ME }); p.joined = true;
    save(); renderParties(); updateBadge(); openInfo(id);
  }
  function leave(id) {
    const p = find(id); if (!p) return;
    dropMe(p);
    save(); renderParties(); updateBadge();
    if (state.infoId === id) closeAll();
    toast('You left the expedition');
  }
  function disband(id) {
    state.parties = state.parties.filter(x => x.id !== id);
    save(); renderParties(); updateBadge();
    if (state.infoId === id) closeAll();
    toast('Expedition disbanded');
  }

  $('#filters').addEventListener('click', e => {
    const c = e.target.closest('.chip'); if (!c) return;
    state.filter = +c.dataset.f;
    $$('#filters .chip').forEach(x => x.classList.toggle('on', x === c));
    renderParties();
  });

  /* ---------- expedition info ---------- */
  function openInfo(id) { state.infoId = id; renderInfo(); open('#infoLayer'); }

  function renderInfo() {
    const p = find(state.infoId);
    if (!p) { closeAll(); return; }
    const n = p.players.length, host = p.mine, full = n >= p.max;

    $('#iLv').textContent = 'Lv. ' + DIFFS[p.diff].lv;
    $('#iMax').textContent = '👥 ' + p.max;
    $('#iDiff').textContent = SYMB[p.diff];
    $('#iMembers').textContent = 'Members ' + n + '/' + p.max;
    const chk = $('#iFull'); chk.checked = p.fullStart; chk.disabled = !host;
    $('#iStatusTxt').textContent = full ? 'Ready to start!' : 'Recruiting an expedition!';
    $('#iName').textContent = p.name;
    fillRewards($('#iRewards'), p.diff, 8, false);

    const box = $('#slots'); box.innerHTML = '';
    for (let i = 0; i < 5; i++) {
      let row;
      if (i < n) {
        const pl = p.players[i];
        row = el('div', 'slot filled' + (pl.me ? ' me' : ''));
        const who = el('div', 'who');
        const l1 = el('div', 'l1');
        l1.append(el('span', 'crown', i === 0 ? '♛' : ''), el('span', 'lv', 'Lv. ' + pl.lv), el('span', 'pn', pl.name + (pl.me ? ' (you)' : '')));
        who.append(l1, el('div', 'l2', '⚔ ' + pl.power.toLocaleString('en-US')));
        row.append(el('span', 'sn', i + 1), el('span', 'ico', '⚔'), who, el('span', 'cls', pl.cls));
        if (host && i > 0) {
          const k = el('button', 'kick', '✕'); k.title = 'Remove player'; k.onclick = () => kick(p.id, i);
          row.append(k);
        }
      } else if (i < p.max) {
        row = el('div', 'slot empty');
        const add = el('button', 'plus', '+');
        add.title = host ? 'Invite a player' : 'Only the host can invite';
        add.onclick = () => invite(p.id);
        row.append(el('span', 'all', 'All'), el('span', 'allow', '⇧ All Allowed'), add);
      } else {
        row = el('div', 'slot locked');
        row.append(el('span', 'all', '—'), el('span', 'allow', 'Closed'));
      }
      box.appendChild(row);
    }

    $('#iDisband').textContent = host ? 'Disband' : 'Leave';
    const st = $('#iStart');
    st.disabled = !host || (p.fullStart && !full);
    st.title = !host ? 'Only the host can start' : (st.disabled ? 'Waiting for full members' : '');
  }

  function invite(id) {
    const p = find(id); if (!p) return;
    if (!p.mine) return toast('Only the host can invite players');
    if (p.players.length >= p.max) return toast('The expedition is full');
    let k = p.players.length + p.id, pl, guard = 0;
    do { pl = person(k++, p.id); } while (p.players.some(x => x.name === pl.name) && ++guard < 20);
    p.players.push(pl);
    save(); renderInfo(); renderParties(); updateBadge();
    toast(pl.name + ' joined the expedition');
  }
  function kick(id, i) {
    const p = find(id); if (!p || !p.mine || i < 1) return;
    const [gone] = p.players.splice(i, 1);
    save(); renderInfo(); renderParties(); updateBadge();
    toast(gone.name + ' was removed');
  }
  $('#iDisband').onclick = () => { const p = find(state.infoId); if (p) (p.mine ? disband(p.id) : leave(p.id)); };
  $('#iStart').onclick = () => {
    const p = find(state.infoId); if (!p || $('#iStart').disabled) return;
    state.parties = state.parties.filter(x => x.id !== p.id);
    save(); updateBadge(); closeAll();
    toast('Expedition started! Good luck!');
  };
  $('#iFull').onchange = e => { const p = find(state.infoId); if (p && p.mine) { p.fullStart = e.target.checked; save(); renderInfo(); } };

  /* ---------- camadas ---------- */
  const open = id => $(id).classList.add('open');
  const closeAll = () => $$('.layer').forEach(l => l.classList.remove('open'));
  $$('[data-close]').forEach(b => b.addEventListener('click', closeAll));
  $$('.layer').forEach(l => l.addEventListener('mousedown', e => { if (e.target === l) closeAll(); }));
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeAll(); });

  $('#btnSearch').onclick = () => { renderParties(); open('#partyLayer'); };

  $('#btnCreate').onclick = () => {
    const m = mine();
    if (m) return openInfo(m.id);
    $('#fDiff').value = state.diff;
    $('#fName').value = '';
    open('#createLayer');
    setTimeout(() => $('#fName').focus(), 50);
  };

  function createExpedition() {
    const id = state.nextId++;
    const name = $('#fName').value.trim() || 'Expedition #' + id;
    state.parties.forEach(x => { if (x.joined) dropMe(x); });
    state.parties.push({
      id, name, diff: +$('#fDiff').value, max: +$('#fMax').value,
      players: [{ ...ME }], mine: true, joined: false, fullStart: true
    });
    save(); updateBadge(); closeAll();
    openInfo(id);
    toast('Expedition created!');
  }
  $('#fOk').onclick = createExpedition;
  $('#fName').addEventListener('keydown', e => { if (e.key === 'Enter') createExpedition(); });

  /* ---------- lista de bosses (rolagem + seleção) ---------- */
  const strips = $('#strips');
  strips.addEventListener('wheel', e => {
    if (e.deltaY) { e.preventDefault(); strips.scrollLeft += e.deltaY; }
  }, { passive: false });
  strips.addEventListener('click', e => {
    const s = e.target.closest('.strip'); if (!s) return;
    $$('.strip').forEach(x => x.classList.toggle('on', x === s));
  });

  /* ---------- tabs ---------- */
  $$('.tab').forEach(t => t.onclick = () => { $$('.tab').forEach(x => x.classList.toggle('active', x === t)); });

  /* ---------- init ---------- */
  setDiff(state.diff); updateBadge();

  /* ---------- escala para caber em qualquer área (preview, mobile, desktop) ---------- */
  const fit = () => {
    const s = Math.min(innerWidth / 1087, innerHeight / 545) * 0.96;
    $('#modal').style.setProperty('--s', Math.max(0.2, s).toFixed(4));
  };
  addEventListener('resize', fit);
  fit();
})();
</script>
</body>
</html>
