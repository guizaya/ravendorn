<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Inventário de Aldara</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Rajdhani:wght@500;600;700&display=swap">
<style>
  /* Layout: duas janelas com moldura dourada chanfrada, como num MMORPG de ação.
     Esquerda: personagem (cinco slots de cada lado do boneco, atributos embaixo).
     Direita: mochila com abas, grade, moedas e barra de ações. No celular as janelas empilham.
     Visual escuro de propósito: azul-marinho profundo, ouro velho e cores de raridade. */
  :root {
    --bg: #07090f;
    --navy-1: #0b1120;
    --navy-2: #111a2e;
    --navy-3: #1a2641;
    --line: #2a3857;
    --gold-hi: #f0d594;
    --gold: #cfa95b;
    --gold-lo: #7a5a26;
    --ink: #e6e1d3;
    --mute: #8d97ad;
    --good: #7ddc8a;
    --bad: #ef6a62;
    --crimson: #c23a3f;
    --r0: #aab2c0;
    --r1: #5fd07a;
    --r2: #4da3ff;
    --r3: #b672ff;
    --r4: #ffa23a;
    --font-display: "Cinzel", "Trajan Pro", Georgia, serif;
    --font-ui: "Rajdhani", "Arial Narrow", system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    background-color: var(--bg);
    background-image:
      radial-gradient(900px 520px at 50% -12%, #1b2a4d 0%, transparent 66%),
      radial-gradient(760px 420px at 92% 112%, #2a1218 0%, transparent 62%),
      repeating-linear-gradient(135deg, rgba(255,255,255,.014) 0 2px, transparent 2px 7px);
    color: var(--ink);
    font: 500 16px/1.3 var(--font-ui);
    -webkit-font-smoothing: antialiased;
  }
  /* largura mínima de projeto: abaixo dela o conjunto inteiro é reduzido, e as janelas nunca empilham */
  .app { max-width: 1140px; min-width: 900px; margin: 0 auto; padding-inline: 16px; padding-block: 22px 52px; }
  .top { margin-bottom: 16px; }
  .eyebrow { margin: 0; font: 600 12px var(--font-display); letter-spacing: .34em; text-transform: uppercase; color: var(--gold); }
  h1 { margin: 2px 0 0; font: 700 clamp(24px, 4vw, 32px)/1.1 var(--font-display); letter-spacing: .06em; }

  /* molduras chanfradas */
  .fr, .fr::after, .win, .win-in, .btn, .t-box, .t-in {
    clip-path: polygon(var(--c) 0, calc(100% - var(--c)) 0, 100% var(--c), 100% calc(100% - var(--c)), calc(100% - var(--c)) 100%, var(--c) 100%, 0 calc(100% - var(--c)), 0 var(--c));
  }
  .board { display: grid; grid-template-columns: minmax(0, .88fr) minmax(0, 1fr); gap: 18px; align-items: start; }
  .win-wrap { filter: drop-shadow(0 18px 28px rgba(0,0,0,.55)); min-width: 0; }
  .win { --c: 18px; padding: 1.5px; background: linear-gradient(160deg, var(--gold-hi) 0%, var(--gold-lo) 28%, var(--gold) 52%, var(--gold-lo) 78%, #3a2c12 100%); }
  .win-in { --c: 17px; padding: 18px 18px 20px; background: linear-gradient(180deg, var(--navy-2), var(--navy-1) 70%); position: relative; container-type: inline-size; }
  .win-title { display: flex; align-items: center; gap: 14px; margin: 0 0 16px; }
  .win-title::before, .win-title::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--gold-lo) 60%, var(--gold)); }
  .win-title::after { transform: scaleX(-1); }
  h2 { margin: 0; font: 700 15px var(--font-display); letter-spacing: .26em; text-transform: uppercase; color: var(--gold-hi); }

  /* personagem */
  .char-head { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; }
  .hex { position: relative; width: 50px; height: 56px; display: grid; place-items: center; background: linear-gradient(160deg, var(--gold-hi), var(--gold-lo)); clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); }
  .hex::before { content: ""; position: absolute; inset: 2px; background: linear-gradient(#18233f, #0b1120); clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); }
  .hex span { position: relative; font: 700 20px var(--font-ui); color: var(--gold-hi); font-variant-numeric: tabular-nums; }
  .char-name { font: 700 18px/1.15 var(--font-display); letter-spacing: .04em; overflow-wrap: anywhere; }
  .char-class { color: var(--mute); font-size: 15px; letter-spacing: .04em; }
  .cp { text-align: right; line-height: 1; }
  .cp small { display: block; margin-bottom: 4px; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--mute); }
  .cp b { font: 700 28px var(--font-ui); color: var(--gold-hi); text-shadow: 0 0 18px rgba(240,213,148,.35); font-variant-numeric: tabular-nums; }
  .bars { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 14px 0 16px; }
  @container (max-width: 330px) { .bars { grid-template-columns: 1fr; } .cp b { font-size: 22px; } .char-name { font-size: 16px; } }
  .bar-label { display: flex; justify-content: space-between; font-size: 13px; color: var(--mute); font-variant-numeric: tabular-nums; margin-bottom: 3px; }
  .bar { height: 9px; background: #060910; border: 1px solid var(--line); overflow: hidden; }
  .bar i { display: block; height: 100%; transition: width .35s ease; }
  .bar.hp i { background: linear-gradient(#e0555a, #8f2428); }
  .bar.xp i { background: linear-gradient(var(--gold-hi), var(--gold-lo)); }

  /* slots */
  .slot { --c: 7px; --rc: var(--r0); position: relative; aspect-ratio: 1; display: grid; place-items: center; user-select: none; -webkit-user-select: none; transition: filter .12s ease, opacity .15s ease; }
  .fr { position: absolute; inset: 0; background: linear-gradient(150deg, #44537a, #1d2845); pointer-events: none; }
  .fr::after { content: ""; position: absolute; inset: 1.5px; background: radial-gradient(circle at 50% 38%, #121b30 0%, #090e1b 85%); }
  .slot.has { cursor: grab; color: var(--rc); }
  .slot.has .fr { background: linear-gradient(150deg, color-mix(in srgb, var(--rc) 55%, #fff), color-mix(in srgb, var(--rc) 55%, #000)); }
  .slot.has .fr::after { background: radial-gradient(circle at 50% 30%, color-mix(in srgb, var(--rc) 34%, #101a30) 0%, #0a1020 86%); }
  .rar-1 { --rc: var(--r1); } .rar-2 { --rc: var(--r2); } .rar-3 { --rc: var(--r3); } .rar-4 { --rc: var(--r4); }
  .slot.has:hover, .slot.has:focus-visible { outline: none; filter: drop-shadow(0 0 9px color-mix(in srgb, var(--rc) 85%, transparent)); }
  .slot:focus-visible .fr, .slot.sel .fr { background: linear-gradient(150deg, var(--gold-hi), var(--gold-lo)); }
  .slot.sel { filter: drop-shadow(0 0 8px rgba(240,213,148,.5)); }
  .slot .ico { position: relative; width: 62%; height: 62%; filter: drop-shadow(0 2px 2px rgba(0,0,0,.7)); pointer-events: none; }
  .slot.locked .ico { opacity: .5; }
  .slot.dim { opacity: .22; }
  .slot.drop-ok .fr { background: linear-gradient(150deg, var(--gold-hi), var(--gold)); }
  .slot.drop-ok { filter: drop-shadow(0 0 10px rgba(240,213,148,.6)); }
  .slot.ghost .fr { background: linear-gradient(150deg, #34416a, #18223c); }
  .slot.ghost .ico { color: var(--mute); opacity: .26; width: 50%; height: 50%; margin-bottom: 11px; }
  .cap { position: absolute; left: 0; right: 0; bottom: 5px; text-align: center; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--mute); pointer-events: none; }
  .plus { position: absolute; right: 6px; top: 3px; font: 700 13px var(--font-ui); color: var(--gold-hi); text-shadow: 0 1px 2px #000, 0 0 4px #000; pointer-events: none; }
  .qty { position: absolute; right: 6px; bottom: 2px; font: 700 14px var(--font-ui); color: #fff; text-shadow: 0 1px 2px #000, 0 0 4px #000; font-variant-numeric: tabular-nums; pointer-events: none; }
  .lvl-lock { position: absolute; left: 6px; top: 3px; font: 700 12px var(--font-ui); color: var(--bad); text-shadow: 0 1px 2px #000; pointer-events: none; }
  .slot.flash { animation: flash .85s ease-out; }
  @keyframes flash { 0% { filter: drop-shadow(0 0 2px #fff) drop-shadow(0 0 24px var(--rc)); } 100% { filter: drop-shadow(0 0 0 transparent); } }
  @keyframes spin { to { rotate: 360deg; } }
  @media (prefers-reduced-motion: reduce) { .slot.flash, .rune { animation: none !important; } .bar i { transition: none; } }

  /* slots de equipamento posicionados nos pontos do corpo (sem desenho de personagem) */
  .paper { --s: clamp(52px, 21cqw, 84px); display: grid; justify-content: center; grid-template-columns: repeat(3, var(--s)); grid-template-rows: repeat(5, var(--s)); gap: clamp(8px, 2.6cqw, 14px); }
  .paper .slot { width: var(--s); height: var(--s); z-index: 1; }
  @container (max-width: 380px) { .cap { display: none; } .slot.ghost .ico { margin-bottom: 0; } }
  .aura { grid-area: 1 / 1 / 6 / 4; position: relative; display: grid; place-items: center; pointer-events: none;
    background: radial-gradient(closest-side, rgba(46,72,128,.4) 0%, rgba(20,30,56,.2) 60%, transparent 100%); }
  .rune { position: absolute; left: 50%; top: 50%; translate: -50% -50%; width: 125%; color: var(--gold-lo); opacity: .55; animation: spin 150s linear infinite; pointer-events: none; }

  /* atributos */
  .stats { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 2px 26px; }
  .stat { display: flex; align-items: baseline; gap: 8px; padding: 6px 2px; border-bottom: 1px solid #1c2740; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--mute); letter-spacing: .04em; }
  .stat b { margin-left: auto; font-size: 19px; font-weight: 600; }
  .stat em { font-style: normal; color: var(--good); font-size: 14px; }

  /* mochila */
  .tabs { display: flex; flex-wrap: wrap; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
  .tab { position: relative; font: 600 15px var(--font-ui); letter-spacing: .08em; text-transform: uppercase; color: var(--mute); background: none; border: 0; padding: 9px 13px 10px; cursor: pointer; }
  .tab:hover { color: var(--ink); }
  .tab[aria-selected="true"] { color: var(--gold-hi); background: linear-gradient(transparent, rgba(207,169,91,.12)); }
  .tab[aria-selected="true"]::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: -1px; height: 2px; background: var(--gold); box-shadow: 0 0 10px var(--gold); }
  .tab:focus-visible { outline: 2px solid var(--gold); outline-offset: -2px; }
  .grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
  @container (min-width: 300px) { .grid { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
  @container (min-width: 360px) { .grid { grid-template-columns: repeat(8, minmax(0, 1fr)); } }
  @container (min-width: 620px) { .grid { grid-template-columns: repeat(10, minmax(0, 1fr)); } }
  @container (max-width: 299px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  @container (max-width: 520px) { .tab { padding: 8px 9px 9px; font-size: 14px; letter-spacing: .04em; } }
  .bag-foot { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; justify-content: space-between; margin-top: 16px; }
  .wallet { display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .coin { display: inline-flex; align-items: center; gap: 8px; }
  .coin::before { content: ""; width: 14px; height: 14px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff1b8, #d6a93c 55%, #7d5d14); box-shadow: 0 0 0 1px #3d2d08; }
  .coin.gem::before { border-radius: 0; width: 14px; height: 14px; background: linear-gradient(135deg, #bff3ff, #3aa9d6 60%, #1c5f86); clip-path: polygon(50% 0, 100% 40%, 50% 100%, 0 40%); box-shadow: none; }
  .count { color: var(--mute); font-size: 15px; font-variant-numeric: tabular-nums; }

  .btn { --c: 6px; font: 700 14px var(--font-ui); letter-spacing: .1em; text-transform: uppercase; color: var(--ink); padding: 9px 20px; cursor: pointer;
    border: 1.5px solid transparent;
    background: linear-gradient(#1c2a4a, #121c35) padding-box, linear-gradient(160deg, var(--gold-hi), var(--gold-lo)) border-box; }
  .btn:hover { background: linear-gradient(#26375e, #172344) padding-box, linear-gradient(160deg, #fff0c4, var(--gold)) border-box; }
  .btn:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 2px; }
  .btn.primary { color: #1a1307; background: linear-gradient(#f2d899, #b98d3d) padding-box, linear-gradient(160deg, #fff6d6, var(--gold)) border-box; }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.warn { color: #fff; background: linear-gradient(#a8353a, #6d1e22) padding-box, linear-gradient(160deg, #ff9d96, #a8353a) border-box; }
  .btn[disabled] { opacity: .5; cursor: not-allowed; filter: grayscale(.6); }

  .actions { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; min-height: 58px; margin-top: 16px; padding: 10px 14px; background: linear-gradient(90deg, rgba(26,38,65,.9), rgba(17,26,46,.6)); border: 1px solid var(--line); }
  .sel-info { display: grid; min-width: 0; }
  .sel-name { font: 700 15px/1.2 var(--font-display); letter-spacing: .03em; overflow-wrap: anywhere; }
  .sel-sub { color: var(--mute); font-size: 14px; }
  .actions .spacer { flex: 1 1 0; }
  .actions .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .actions .none { color: var(--mute); }
  .msg { min-height: 22px; margin-top: 10px; font-size: 16px; color: var(--mute); }
  .msg.ok { color: var(--good); } .msg.bad { color: var(--bad); }
  .hint { margin: 4px 0 0; font-size: 14px; color: var(--mute); }
  .hint kbd { font: 700 12px var(--font-ui); letter-spacing: .06em; padding: 1px 7px; border: 1px solid var(--line); background: #0a1020; color: var(--ink); }

  [hidden] { display: none !important; }
  /* forja */
  .up { color: var(--good); } .neg { color: var(--bad); }
  .tab.forge-tab { display: inline-flex; align-items: center; gap: 7px; align-self: center; margin: 0 10px 6px 0; padding: 7px 14px; color: #1a1307; font-weight: 700;
    background: linear-gradient(#f2d899, #b98d3d); border: 1px solid var(--gold-hi); box-shadow: 0 0 14px rgba(207,169,91,.28); }
  .tab.forge-tab:hover { color: #1a1307; filter: brightness(1.08); }
  .tab.forge-tab[aria-selected="true"] { background: linear-gradient(#b98d3d, #7a5a26); color: #fff3d2; box-shadow: 0 0 0 1px var(--gold-hi), 0 0 18px rgba(240,213,148,.45); }
  .tab.forge-tab::after { display: none; }
  .forge { display: grid; gap: 14px; }
  .fmodes { display: flex; gap: 8px; }
  .seg { font: 700 14px var(--font-ui); letter-spacing: .12em; text-transform: uppercase; color: var(--mute); background: #0a1020; border: 1px solid var(--line); padding: 8px 18px; cursor: pointer; }
  .seg:hover { color: var(--ink); border-color: var(--gold-lo); }
  .seg[aria-pressed="true"] { color: #1a1307; background: linear-gradient(#f2d899, #b98d3d); border-color: var(--gold-hi); }
  .seg:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 2px; }
  .craft { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; align-items: start; }
  @container (min-width: 520px) { .craft { grid-template-columns: minmax(0, .92fr) minmax(0, 1.08fr); } }
  .rlist { display: grid; gap: 5px; align-content: start; max-height: 372px; overflow-y: auto; padding-right: 4px; }
  .rline { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; margin-top: 2px; }
  .rrow { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 10px; align-items: center; padding: 6px 8px; background: rgba(26,38,65,.55); border: 1px solid var(--line); cursor: pointer; }
  .rrow:hover { border-color: var(--gold-lo); }
  .rrow[aria-pressed="true"] { border-color: var(--gold); background: rgba(207,169,91,.11); }
  .rrow:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 1px; }
  .rrow .slot, .ing .slot { width: 40px; height: 40px; }
  .rtxt { min-width: 0; }
  .rname { font: 700 14px/1.15 var(--font-display); letter-spacing: .02em; overflow-wrap: anywhere; }
  .rname.big { font-size: 16px; }
  .rsub { font-size: 14px; color: var(--mute); }
  .badge { font: 700 12px var(--font-ui); letter-spacing: .1em; text-transform: uppercase; padding: 2px 7px; border: 1px solid currentColor; white-space: nowrap; }
  .badge.ok { color: var(--good); } .badge.no { color: var(--mute); } .badge.bad { color: var(--bad); }
  .detail { display: grid; gap: 12px; align-content: start; min-width: 0; padding: 12px; background: linear-gradient(180deg, rgba(26,38,65,.85), rgba(14,21,38,.7)); border: 1px solid var(--line); }
  .d-head { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; align-items: center; }
  .d-head .slot { width: 64px; height: 64px; }
  .ing { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 10px; align-items: center; }
  .have { font: 700 17px var(--font-ui); font-variant-numeric: tabular-nums; }
  .have.ok { color: var(--good); } .have.no { color: var(--bad); }
  .sect { font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--mute); margin: 0 0 6px; }
  .detail .stat b { font-size: 17px; }
  .detail .arrow { color: var(--mute); }
  .note { font-size: 14px; color: var(--mute); margin: 6px 0 0; }
  .note.warn { color: var(--bad); }
  .bar.gold i { background: linear-gradient(var(--gold-hi), var(--gold-lo)); }
  .bar.prog i { width: 0; background: linear-gradient(var(--gold-hi), var(--gold)); animation: fill var(--dur, 1100ms) linear forwards; }
  @keyframes fill { to { width: 100%; } }
  .result { padding: 8px 10px; border: 1px solid currentColor; font-weight: 700; font-size: 15px; }
  .result.ok { color: var(--good); background: rgba(125,220,138,.08); } .result.bad { color: var(--bad); background: rgba(239,106,98,.08); }
  .pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(50px, 1fr)); gap: 6px; }
  .pick-wrap { display: grid; gap: 8px; align-content: start; max-height: 372px; overflow-y: auto; padding-right: 4px; min-width: 0; }
  .slot[data-src="cat"] { cursor: default; }

  /* dica flutuante */
  #tip { --rc: var(--gold); position: fixed; left: 0; top: 0; z-index: 100; width: max-content; max-width: min(310px, calc(100vw - 24px)); pointer-events: none; opacity: 0; transition: opacity .08s ease; filter: drop-shadow(0 14px 26px rgba(0,0,0,.75)); }
  #tip.on { opacity: 1; }
  .t-box { --c: 9px; padding: 1.5px; background: linear-gradient(160deg, color-mix(in srgb, var(--rc) 70%, #fff), color-mix(in srgb, var(--rc) 45%, #000)); }
  .t-in { --c: 8px; background: #090e1b; }
  .t-head { padding: 11px 14px 9px; background: linear-gradient(90deg, color-mix(in srgb, var(--rc) 38%, #090e1b), #090e1b 92%); }
  .t-name { font: 700 15px/1.2 var(--font-display); letter-spacing: .03em; color: var(--rc); text-wrap: balance; }
  .t-name i { font-style: normal; color: var(--gold-hi); margin-left: 4px; }
  .t-sub { margin-top: 3px; font-size: 14px; color: var(--mute); letter-spacing: .04em; }
  .t-body { padding: 4px 14px 11px; }
  .t-tag { display: inline-block; margin: 7px 0 0; font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--gold); }
  .t-power { display: flex; align-items: baseline; gap: 10px; padding: 8px 0 6px; border-bottom: 1px solid var(--line); }
  .t-power span { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--mute); }
  .t-power b { font: 700 24px var(--font-ui); color: var(--gold-hi); font-variant-numeric: tabular-nums; }
  .t-power em { margin-left: auto; font-style: normal; font-weight: 700; font-size: 15px; }
  .t-block { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); }
  .t-block:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
  .t-stat { display: flex; justify-content: space-between; gap: 18px; font-size: 16px; font-variant-numeric: tabular-nums; }
  .t-stat span { color: var(--mute); }
  .t-stat b { font-weight: 600; color: var(--good); }
  .t-stat b.neutral { color: var(--ink); } .t-stat b.bad, em.down, .t-stat b.down { color: var(--bad); } .t-stat b.up, em.up { color: var(--good); }
  .t-use { font-size: 16px; color: var(--good); }
  .t-desc { margin: 9px 0 0; font-size: 14px; font-style: italic; color: #a8a79a; line-height: 1.35; }
  .t-cap { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--mute); margin-bottom: 4px; }
  .t-cap span { letter-spacing: .02em; text-transform: none; font-size: 15px; font-weight: 700; }

    if (f.max) return say('Esta peça já está no aprimoramento máximo.', 'bad');
    if (countOf('m_pedra') < f.stones) return say('Faltam Pedras de Aprimoramento.', 'bad');
    if (gold < f.gold) return say('Ouro insuficiente.', 'bad');
    crafting = true; render();
    setTimeout(() => {
      crafting = false;
      take(inv, 'm_pedra', f.stones); gold -= f.gold;
      if (Math.random() * 100 < f.chance) {
        e.plus = f.n + 1;
        lastResult = { kind: 'enh', ok: true, fresh: true, text: `Sucesso! ${it.name} agora está em +${e.plus}.` };
        say(`Aprimorado: ${it.name} +${e.plus}.`, 'ok');
      } else {
        if (f.drop) e.plus = f.n - 1 || 0;
        if (!e.plus) delete e.plus;
        lastResult = { kind: 'enh', ok: false, fresh: true, text: f.drop ? `Falhou. ${it.name} caiu para +${f.n - 1}.` : 'Falhou. As pedras e o ouro foram perdidos.' };
        say(lastResult.text, 'bad'); clampHp();
      }
      commit();
    }, DUR);
  }
  const progress = () => `<div class="bar prog" style="--dur:${DUR}ms" role="progressbar" aria-label="Forjando"><i></i></div>`;
  function craftHtml() {
    const r = RECIPES.find(x => x.id === rsel) || RECIPES[0], it = ITEMS[r.out], c = canCraft(r), gear = isGear(it);
    const rows = RECIPES.map(q => {
      const o = ITEMS[q.out], k = canCraft(q);
      const b = k.ok ? ['ok', 'Pronto'] : !k.lvlOk ? ['bad', 'Nv. ' + rlvl(q)] : k.miss ? ['no', 'Faltam materiais'] : ['no', 'Sem ouro'];
      return `<div class="rrow" role="button" tabindex="0" data-rcp="${q.id}" aria-pressed="${rsel === q.id}">${slot('cat', q.out, { id: q.out })}<div class="rtxt"><div class="rname" style="color:var(--r${o.r})">${o.name}${q.qty > 1 ? ' ×' + q.qty : ''}</div><div class="rline"><span class="rsub">${q.chance}%</span><span class="badge ${b[0]}">${b[1]}</span></div></div></div>`;
    }).join('');
    const ing = Object.entries(r.cost).map(([id, n]) => {
      const m = ITEMS[id], have = countOf(id);
      return `<div class="ing">${slot('cat', id, { id })}<div class="rtxt"><div class="rname" style="color:var(--r${m.r})">${m.name}</div></div><span class="have ${have >= n ? 'ok' : 'no'}">${fmt(have)} / ${n}</span></div>`;
    }).join('');
    const reason = !c.lvlOk ? `Exige nível ${rlvl(r)}.` : c.miss ? 'Faltam materiais.' : !c.goldOk ? 'Ouro insuficiente.' : '';
    const lr = lastResult && lastResult.kind === 'craft' && lastResult.id === r.out ? lastResult : null;
    const res = lr ? `<div class="result ${lr.ok ? 'ok' : 'bad'}">${lr.ok ? `Sucesso! ${it.name} criado.` : 'A criação falhou. Metade dos materiais foi perdida.'}</div>` : '';
    return `<div class="craft"><div class="rlist" role="group" aria-label="Receitas">${rows}</div>
      <div class="detail">
        <div class="d-head">${slot('cat', r.out, { id: r.out }, { flash: !!(lr && lr.ok && lr.fresh) })}<div class="rtxt"><div class="rname big" style="color:var(--r${it.r})">${it.name}${r.qty > 1 ? ' ×' + r.qty : ''}</div><div class="rsub">${RAR[it.r]} · ${it.sub}${gear ? ` · Poder ${fmt(powerOf({ id: r.out }))}` : ''}</div></div></div>
        <div><p class="sect">Materiais</p><div style="display:grid;gap:6px">${ing}</div></div>
        <div class="stat"><span>Custo</span><b class="${c.goldOk ? '' : 'neg'}"><span class="coin">${fmt(r.gold)}</span></b></div>
        <div><div class="bar-label"><span>Chance de sucesso</span><span>${r.chance}%</span></div><div class="bar gold"><i style="width:${r.chance}%"></i></div>${r.chance < 100 ? '<p class="note">Se falhar, você perde metade dos materiais e o ouro.</p>' : ''}</div>
        ${res}
        ${crafting ? progress() + '<button type="button" class="btn primary" disabled>Forjando…</button>' : `<button type="button" class="btn primary" data-act="craft"${c.ok ? '' : ' disabled'}>Criar</button>${reason ? `<p class="note">${reason}</p>` : ''}`}
      </div></div>`;
  }
  function enhanceHtml() {
    const eqs = Object.keys(eq).filter(k => eq[k]).map(k => slot('eq', k, eq[k])).join('');
    const bag = inv.map((e, i) => (e && isGear(ITEMS[e.id]) ? slot('inv', i, e) : '')).join('');
    const e = sel ? get(sel.src, sel.key) : null, it = itemOf(e);
    let det;
    if (!it || !isGear(it)) det = '<div class="detail"><p class="note">Selecione uma peça equipada ou da mochila para aprimorar.</p></div>';
    else {
      const f = enhanceInfo(e), a = statsOf(e), b = statsOf({ id: e.id, plus: f.n + 1 });
      const stones = countOf('m_pedra'), ok = !f.max && stones >= f.stones && gold >= f.gold;
      const rows = ORDER.filter(s => a[s]).map(s => `<div class="stat"><span>${STAT[s][0]}</span><b>${fmt(a[s])}${STAT[s][1]}${!f.max && SCALED.includes(s) ? ` <span class="arrow">→</span> <span class="up">${fmt(b[s])}</span>` : ''}</b></div>`).join('');
      const reason = f.max ? 'Aprimoramento máximo (+10).' : stones < f.stones ? 'Faltam Pedras de Aprimoramento.' : gold < f.gold ? 'Ouro insuficiente.' : '';
      const lr = lastResult && lastResult.kind === 'enh' ? lastResult : null;
      det = `<div class="detail">
        <div class="d-head">${slot(sel.src, sel.key, e, { flash: !!(lr && lr.ok && lr.fresh) })}<div class="rtxt"><div class="rname big" style="color:var(--r${it.r})">${it.name} <span style="color:var(--gold-hi)">+${f.n}${f.max ? '' : ` → +${f.n + 1}`}</span></div><div class="rsub">${RAR[it.r]} · ${it.sub}</div></div></div>
        <div>${rows}<div class="stat"><span>Poder</span><b>${fmt(powerOf(e))}${f.max ? '' : ` <span class="arrow">→</span> <span class="up">${fmt(powerOf({ id: e.id, plus: f.n + 1 }))}</span>`}</b></div></div>
        ${f.max ? '' : `<div><p class="sect">Materiais</p><div class="ing">${slot('cat', 'm_pedra', { id: 'm_pedra' })}<div class="rtxt"><div class="rname" style="color:var(--r1)">${ITEMS.m_pedra.name}</div></div><span class="have ${stones >= f.stones ? 'ok' : 'no'}">${fmt(stones)} / ${f.stones}</span></div></div>
        <div class="stat"><span>Custo</span><b class="${gold >= f.gold ? '' : 'neg'}"><span class="coin">${fmt(f.gold)}</span></b></div>
        <div><div class="bar-label"><span>Chance de sucesso</span><span>${f.chance}%</span></div><div class="bar gold"><i style="width:${f.chance}%"></i></div><p class="note${f.drop ? ' warn' : ''}">${f.drop ? 'Se falhar, a peça perde 1 nível de aprimoramento e você perde as pedras e o ouro.' : f.chance < 100 ? 'Se falhar, você perde as pedras e o ouro. A peça não muda.' : 'Aprimoramento garantido.'}</p></div>`}
        ${lr ? `<div class="result ${lr.ok ? 'ok' : 'bad'}">${lr.text}</div>` : ''}
        ${f.max ? '<p class="note">Esta peça já está no aprimoramento máximo.</p>' : crafting ? progress() + '<button type="button" class="btn primary" disabled>Forjando…</button>' : `<button type="button" class="btn primary" data-act="enhance"${ok ? '' : ' disabled'}>Aprimorar</button>${reason ? `<p class="note">${reason}</p>` : ''}`}
      </div>`;
    }
    return `<div class="craft"><div class="pick-wrap">${eqs ? `<div><p class="sect">Equipadas</p><div class="pick">${eqs}</div></div>` : ''}${bag ? `<div><p class="sect">Na mochila</p><div class="pick">${bag}</div></div>` : ''}</div>${det}</div>`;
  }
  function renderForge() {
    $('#forge').innerHTML = `<div class="fmodes" role="group" aria-label="Modo da forja"><button type="button" class="seg" data-fmode="craft" aria-pressed="${fmode === 'craft'}">Criar</button><button type="button" class="seg" data-fmode="enhance" aria-pressed="${fmode === 'enhance'}">Aprimorar</button></div>`
      + (fmode === 'craft' ? craftHtml() : enhanceHtml());
  }

  /* ---------- eventos ---------- */
  document.addEventListener('click', e => {
    const prev = pendingSell; pendingSell = null; lastResult = null;
    if (e.target.closest('[data-view]')) { view = 'forge'; return commit(); }
    const fm = e.target.closest('[data-fmode]');
    if (fm) {
      fmode = fm.dataset.fmode;
      if (fmode === 'enhance') {
        const cur = sel && itemOf(get(sel.src, sel.key));
        if (!cur || !isGear(cur)) { const k = eq.weapon ? 'weapon' : Object.keys(eq).find(x => eq[x]); if (k) sel = { src: 'eq', key: k }; }
      }
      return commit();
    }
    const tab = e.target.closest('[data-filter]');
    if (tab) { filter = tab.dataset.filter; view = 'bag'; return commit(); }
    const act = e.target.closest('[data-act]');
    if (act) {
      if (act.dataset.act === 'craft') return doCraft();
      if (act.dataset.act === 'enhance') return doEnhance();
      if (act.dataset.act === 'sort') return sortInv();
      if (act.dataset.act === 'primary' && sel) return primary(sel.src, sel.key);
      if (act.dataset.act === 'sell' && sel && sel.src === 'inv') {
        const k = String(sel.key);
        if (prev !== null && String(prev) === k) return sell(+k);
        pendingSell = k; return render();
      }
      return;
    }
    const rr = e.target.closest('[data-rcp]');
    if (rr) { rsel = rr.dataset.rcp; return commit(); }
    const el = e.target.closest('.slot[data-src]');
    if (!el || el.dataset.src === 'cat') return;
    if (!get(el.dataset.src, el.dataset.key)) { sel = null; commit(); return; }
    const k = el.dataset.src + ':' + el.dataset.key, now = Date.now();
    if (lastClick.k === k && now - lastClick.t < 400 && view !== 'forge') { lastClick = { k: '', t: 0 }; return primary(el.dataset.src, el.dataset.key); }
    lastClick = { k, t: now }; sel = { src: el.dataset.src, key: el.dataset.key };
    render();
    if (lastType === 'touch') { const n = document.querySelector(`.slot[data-src="${sel.src}"][data-key="${sel.key}"]`); if (n) showTip(n, true); } else syncTip();
  });
  document.addEventListener('contextmenu', e => {
    const el = e.target.closest ? e.target.closest('.slot.has') : null;
    if (el) { e.preventDefault(); pendingSell = null; primary(el.dataset.src, el.dataset.key); }
  });
  document.addEventListener('keydown', e => {
    const rr = e.target.closest ? e.target.closest('[data-rcp]') : null;
    if (rr && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); rsel = rr.dataset.rcp; lastResult = null; return commit(); }
    const el = e.target.closest ? e.target.closest('.slot.has') : null;
    if (!el) return;
    if (e.key === 'Enter') { e.preventDefault(); pendingSell = null; primary(el.dataset.src, el.dataset.key); }
    if (e.key === ' ') { e.preventDefault(); pendingSell = null; sel = { src: el.dataset.src, key: el.dataset.key }; render(); }
  });
  document.addEventListener('focusin', e => {
    const el = e.target.closest ? e.target.closest('.slot[data-src]') : null;
    if (el && el.matches(':focus-visible')) showTip(el, true);
  });
  document.addEventListener('focusout', e => { if (e.target.closest && e.target.closest('.slot')) hideTip(); });

  const mark = on => document.querySelectorAll('.paper .slot').forEach(s => {
    const it = drag && drag.src === 'inv' ? itemOf(inv[+drag.key]) : null;
    s.classList.toggle('drop-ok', !!(on && it && canWear(it, s.dataset.key)));
  });
  document.addEventListener('dragstart', e => {
    const el = e.target.closest ? e.target.closest('.slot.has') : null;
    if (!el) return;
    drag = { src: el.dataset.src, key: el.dataset.key }; dragging = true; hideTip();
    e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', drag.key); mark(true);
  });
  document.addEventListener('dragend', () => { mark(false); drag = null; dragging = false; });
  document.addEventListener('dragover', e => {
    if (drag && e.target.closest && e.target.closest('.slot[data-src], .slot[data-filler]')) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; }
  });
  document.addEventListener('drop', e => {
    const el = e.target.closest ? e.target.closest('.slot[data-src], .slot[data-filler]') : null;
    if (!drag || !el) return;
    e.preventDefault(); const d = drag; mark(false); drag = null; dragging = false; pendingSell = null;
    if (el.dataset.filler) { if (d.src === 'eq') unequip(d.key); return; }
    handleDrop(d, el.dataset.src, el.dataset.key);
  });

  const app = document.querySelector('.app');
  const fit = () => { const z = Math.min(1, innerWidth / 900); app.style.zoom = z < 1 ? String(z) : ''; };
  fit(); addEventListener('resize', fit);

  render();
})();
</script>

</body></html>
